# Fase 2: HTTPS habilitado con certificado Let's Encrypt.
# Usar esta configuracion DESPUES de obtener el certificado con certbot.

# Redirigir HTTP a HTTPS
server {
    listen 80;
    server_name TU_DOMINIO.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS con proxy al worker OCR
server {
    listen 443 ssl http2;
    server_name TU_DOMINIO.com;

    # Certificados Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/TU_DOMINIO.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO.com/privkey.pem;

    # Seguridad SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Headers de seguridad
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Limitar tamano de solicitud (15 MiB para el documento OCR + overhead JSON)
    client_max_body_size 16m;

    # Timeout largo para procesamiento OCR (Tesseract tarda 4-18 segundos)
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;

    # Health check publico (sin autenticacion)
    location = /healthz {
        proxy_pass http://ocr-worker:8080/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Endpoint OCR (protegido por HMAC en la aplicacion)
    location /v1/ocr/ {
        proxy_pass http://ocr-worker:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No cachear resultados OCR
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Bloquear todo lo demas
    location / {
        return 404 '{"error":{"code":"NOT_FOUND","message":"Recurso no encontrado","retryable":false}}';
        default_type application/json;
    }
}
