services:
  - type: web
    name: operacional-centre-kcm-cap
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8787"
      - key: KCM_ENV
        value: production
      - key: KCM_HOST
        value: 0.0.0.0
      - key: KCM_ALLOW_PUBLIC_BIND
        value: "1"
      - key: KCM_LOG_LEVEL
        value: info
      - key: KCM_REQUEST_TIMEOUT_MS
        value: "30000"
      - key: KCM_DATABASE_URL
        sync: false
      - key: KCM_KIOSK_TOKEN_SECRET
        sync: false
      - key: KCM_RELEASE_INTEGRITY_SECRET
        sync: false
